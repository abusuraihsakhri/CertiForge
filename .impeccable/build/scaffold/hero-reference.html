<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: mint_comp_one_1789930848761.jpg</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tilt+Prism:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f4f6f6}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1376px">
  <div class="r-topbar region chrome" data-region="topbar"><!-- navy blue top header bar --></div>
  <div class="r-left-sidebar region chrome" data-region="left-sidebar"><!-- left sidebar panel for tools --></div>
  <div class="r-left-buttons region control" data-region="left-buttons"><!-- tool buttons in left sidebar: rebuild the control's chrome from the crop (comp-spec.mjs --crop left-buttons); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-main-canvas-bg region texture" data-region="main-canvas-bg" style="background-image:url('../../../assets/plates/main-canvas-bg.png');background-repeat:repeat"></div>
  <figure class="r-cert-border region plate" data-region="cert-border"><img src="../../../assets/plates/cert-border.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-cert-title region text" data-region="cert-title"><!-- THE MINT CERTIFICATE OF AUTHENTICITY headline --><p style="font-size:var(--r-cert-title-font);font-family:var(--r-cert-title-family),sans-serif;font-weight:var(--r-cert-title-weight);line-height:1.05;margin:0">cert-title</p></div>
  <div class="r-cert-recipient region text" data-region="cert-recipient"><!-- JOHN A. SMITH recipient name --><p style="font-size:var(--r-cert-recipient-font);line-height:1.05;margin:0">cert-recipient</p></div>
  <figure class="r-cert-seal region plate" data-region="cert-seal"><img src="../../../assets/plates/cert-seal.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-right-data-feed region chrome" data-region="right-data-feed"><!-- right sidebar panel for data feed --></div>
  <div class="r-data-feed-rows region text" data-region="data-feed-rows"><!-- participant data rows --><p style="font-size:var(--r-data-feed-rows-font);line-height:1.05;margin:0">data-feed-rows</p></div>
</main>
</body>
</html>
