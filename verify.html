<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="CertiForge — Digital Certificate Verification Portal. Check certificate data integrity and registry records.">
  <title>Verify Certificate — CertiForge</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="manifest" href="manifest.json">
  <style>
    .verify-shell{min-height:100vh;display:flex;flex-direction:column;background:
      radial-gradient(circle at 15% 15%,rgba(79,70,229,.09),transparent 24%),
      radial-gradient(circle at 85% 75%,rgba(99,102,241,.06),transparent 24%),
      var(--bg)}
    .verify-main{flex:1;display:grid;place-items:center;padding:34px 18px}
    .verify-card{
      width:min(720px,100%);overflow:hidden;
      border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.96);
      box-shadow:0 24px 70px rgba(16,24,40,.12)
    }
    .verify-head{padding:28px 30px 22px;border-bottom:1px solid var(--line);text-align:center}
    .status-badge{
      display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;
      padding:7px 11px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.02em
    }
    .status-badge.verified{background:#ecfdf3;color:#166534;border:1px solid #bbefc9}
    .status-badge.failed{background:#fff1f0;color:#b42318;border:1px solid #fecdca}
    .status-badge.search{background:var(--brand-soft);color:var(--brand-strong);border:1px solid #d7d9ff}
    .status-icon{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900}
    .status-badge.verified .status-icon{background:#16a34a;color:#fff}
    .status-badge.failed .status-icon{background:#b42318;color:#fff}
    .status-badge.search .status-icon{background:var(--brand);color:#fff}
    .verify-title{margin:0;color:#101828;font-size:27px;line-height:1.15;letter-spacing:-.035em}
    .verify-sub{max-width:560px;margin:7px auto 0;color:var(--muted);font-size:12px;line-height:1.55}
    .verify-body{padding:24px 30px 28px}
    .detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .detail-item{
      min-width:0;display:block;padding:12px 13px;
      border:1px solid var(--line);border-radius:11px;background:#fbfcfd
    }
    .detail-label{display:block;margin-bottom:5px;color:#98a2b3;font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    .detail-val{display:block;color:#27364a;font-size:12.5px;font-weight:650;line-height:1.35;word-break:break-word}
    .detail-val.recipient-name{color:var(--brand-strong);font-size:16px;font-weight:780}
    .detail-val.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px}
    .verify-search-box{margin-bottom:14px}
    .verify-search-box .field>div{display:grid!important;grid-template-columns:minmax(0,1fr) auto;gap:8px!important}
    .security-notice{
      margin-top:14px;padding:12px 13px;border:1px solid #dde3ea;border-radius:10px;
      background:#f8fafc;color:#667085;font-size:10.5px;line-height:1.5
    }
    .security-notice strong{color:#344054}
    .verify-actions{display:flex;gap:8px;margin-top:16px}
    .verify-footer{
      padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;
      border-top:1px solid rgba(228,231,236,.7);color:#98a2b3;font-size:9.5px
    }
    .verify-body .card.panel{box-shadow:none;background:#fbfcfe!important;border-color:#d9dee6!important}
    @media(max-width:620px){
      .verify-main{padding:18px 10px}
      .verify-card{border-radius:15px}
      .verify-head{padding:22px 18px 18px}
      .verify-title{font-size:23px}
      .verify-body{padding:18px}
      .detail-grid{grid-template-columns:1fr}
      .verify-actions{flex-direction:column}
      .verify-actions .btn{width:100%}
      .verify-footer{flex-direction:column;align-items:flex-start}
    }
    @media print{
      .topbar,.verify-footer,.verify-actions{display:none!important}
      .verify-main{padding:0}
      .verify-card{box-shadow:none;border:1px solid #ccc}
    }
  </style>
</head>
<body>
<div class="verify-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">CF</div>
      <div><strong>CertiForge</strong><span>Verification Portal</span></div>
    </div>
    <div class="top-actions">
      <a href="index.html" class="btn ghost">Open Studio</a>
    </div>
  </header>

  <main class="verify-main">
    <div class="verify-card" id="verifyCard">
      <div class="verify-head">
        <div class="status-badge search">
          <div class="status-icon">?</div>
          <span>Verification Portal</span>
        </div>
        <h1 class="verify-title">Verifying Certificate...</h1>
        <p class="verify-sub">Checking certificate integrity and registry status.</p>
      </div>
      <div class="verify-body">
        <div class="empty">Loading verification data...</div>
      </div>
    </div>
  </main>

  <footer class="verify-footer">
    <span>CertiForge — Certificate Integrity & Registry Verification</span>
    <span id="timestamp"></span>
  </footer>
</div>

<script>
function rightRotate(v, a) { return (v >>> a) | (v << (32 - a)); }
function sha256(str) {
  const ascii = unescape(encodeURIComponent(str));
  const len = ascii.length;
  const wordsLength = (len + 8 >> 6) + 1 << 4;
  const words = new Array(wordsLength).fill(0);
  for (let i = 0; i < len; i++) words[i >> 2] |= (ascii.charCodeAt(i) & 255) << ((3 - i % 4) * 8);
  words[len >> 2] |= 128 << ((3 - len % 4) * 8);
  words[wordsLength - 1] = len * 8;
  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
  let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const k = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ];
  const w = new Array(64);
  for (let i = 0; i < wordsLength; i += 16) {
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let j = 0; j < 64; j++) {
      if (j < 16) w[j] = words[i + j];
      else {
        const g0 = rightRotate(w[j - 15], 7) ^ rightRotate(w[j - 15], 18) ^ (w[j - 15] >>> 3);
        const g1 = rightRotate(w[j - 2], 17) ^ rightRotate(w[j - 2], 19) ^ (w[j - 2] >>> 10);
        w[j] = (w[j - 16] + g0 + w[j - 7] + g1) | 0;
      }
      const ch = (e & f) ^ (~e & g), maj = (a & b) ^ (a & c) ^ (b & c);
      const s0 = rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22);
      const s1 = rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25);
      const t1 = (h + s1 + ch + k[j] + w[j]) | 0, t2 = (s0 + maj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0;
    h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
  }
  return [h0, h1, h2, h3, h4, h5, h6, h7].map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
}

function esc(str) {
  return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function computeSignature(id, name, event, role, date, org, version = 1, salt = 'CertiForge-Secure-Salt') {
  const fields = [
    String(id || '').trim(),
    String(name || '').trim(),
    String(event || '').trim()
  ];
  if (Number(version) >= 2) fields.push(String(role || '').trim());
  fields.push(
    String(date || '').trim(),
    String(org || '').trim()
  );
  return sha256(fields.join('|') + '|' + salt).slice(0, 16);
}

let loadedRegistry = null;

async function init() {
  document.getElementById('timestamp').textContent = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const name = params.get('name') || params.get('n');
  const event = params.get('event') || params.get('e');
  const role = params.get('role') || params.get('r');
  const date = params.get('date') || params.get('d');
  const org = params.get('org') || params.get('o');
  const sig = params.get('sig') || params.get('s');
  const version = Number(params.get('v') || 1);

  // Load an optional issuer-published registry before evaluating QR data.
  try {
    const res = await fetch('verification-registry.json', { cache: 'no-store' });
    if (res.ok) loadedRegistry = await res.json();
  } catch (_) {
    // A published registry is optional.
  }

  if (id && (name || sig)) {
    const registryRecord = Array.isArray(loadedRegistry?.certificates)
      ? loadedRegistry.certificates.find(c => String(c.id) === String(id) && String(c.sig || '').toLowerCase() === String(sig || '').toLowerCase())
      : null;
    verifyPayload({ id, name, event, role, date, org, sig, version }, { registryMatched: Boolean(registryRecord) });
    return;
  }

  renderPortalSearch();

  const info = document.getElementById('registryStatus');
  if (info && Array.isArray(loadedRegistry?.certificates)) {
    info.innerHTML = `Loaded public registry: <strong>${loadedRegistry.certificates.length} certificate records</strong> for <em>${esc(loadedRegistry.event || loadedRegistry.project || 'Conference')}</em>.`;
  }
}

function verifyPayload({ id, name, event, role, date, org, sig, version = 1 }, { registryMatched = false } = {}) {
  const card = document.getElementById('verifyCard');
  const expectedSig = computeSignature(id, name, event, role, date, org, version);
  const isValid = Boolean(sig) && (sig.toLowerCase() === expectedSig.toLowerCase());

  if (isValid) {
    const statusText = registryMatched ? 'Registry Record Match' : 'Integrity Check Passed';
    const titleText = registryMatched ? 'Certificate Record Matched' : 'Certificate Data Intact';
    const subText = registryMatched
      ? 'The supplied certificate data matches the active registry record and its integrity digest.'
      : 'The supplied data matches its self-contained integrity digest. This alone does not authenticate the issuer.';
    card.innerHTML = `
      <div class="verify-head">
        <div class="status-badge verified">
          <div class="status-icon">✓</div>
          <span>${statusText}</span>
        </div>
        <h1 class="verify-title">${titleText}</h1>
        <p class="verify-sub">${subText}</p>
      </div>
      <div class="verify-body">
        <div class="detail-grid">
          <div class="detail-item">
            <span class="detail-label">Recipient</span>
            <span class="detail-val recipient-name">${esc(name)}</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Certificate ID</span>
            <span class="detail-val mono">${esc(id)}</span>
          </div>
          ${event ? `
          <div class="detail-item">
            <span class="detail-label">Event / Conference</span>
            <span class="detail-val">${esc(event)}</span>
          </div>` : ''}
          ${role ? `
          <div class="detail-item">
            <span class="detail-label">Role</span>
            <span class="detail-val">${esc(role)}</span>
          </div>` : ''}
          ${date ? `
          <div class="detail-item">
            <span class="detail-label">Issue Date</span>
            <span class="detail-val">${esc(date)}</span>
          </div>` : ''}
          ${org ? `
          <div class="detail-item">
            <span class="detail-label">Issuing Authority</span>
            <span class="detail-val">${esc(org)}</span>
          </div>` : ''}
          <div class="detail-item">
            <span class="detail-label">Verification Digest</span>
            <span class="detail-val mono" style="font-size:11px;color:#16a34a">${esc(sig)}</span>
          </div>
        </div>

        <div class="security-notice">
          <strong>Verification scope:</strong> The SHA-256-derived digest detects changes to the certificate data. ${registryMatched ? 'This record also matches the currently loaded registry.' : 'Without a trusted issuer-published registry or asymmetric digital signature, this check is not independent proof of issuer identity.'}
        </div>

        <div class="verify-actions">
          <button class="btn primary" onclick="window.print()" style="flex:1">Print Verification Slip</button>
          <a href="verify.html" class="btn" style="text-align:center">Verify Another</a>
        </div>
      </div>
    `;
  } else {
    card.innerHTML = `
      <div class="verify-head">
        <div class="status-badge failed">
          <div class="status-icon">✕</div>
          <span>Verification Failed</span>
        </div>
        <h1 class="verify-title">Unverified Credential</h1>
        <p class="verify-sub">The cryptographic signature does not match the certificate data.</p>
      </div>
      <div class="verify-body">
        <div class="notice" style="border-color:#fecdd3;background:#fff5f5;color:#991b1b">
          <strong>Integrity Warning:</strong> The URL parameters or certificate details may have been tampered with, altered, or forged.
        </div>
        <div class="detail-grid" style="margin-top:16px">
          <div class="detail-item">
            <span class="detail-label">Supplied ID</span>
            <span class="detail-val mono">${esc(id)}</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Supplied Name</span>
            <span class="detail-val">${esc(name || 'None')}</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Supplied Signature</span>
            <span class="detail-val mono" style="color:#b42318">${esc(sig || 'Missing')}</span>
          </div>
        </div>

        <div class="verify-actions">
          <a href="verify.html" class="btn primary" style="flex:1;text-align:center">Try Manual Search</a>
          <a href="index.html" class="btn" style="text-align:center">CertiForge Home</a>
        </div>
      </div>
    `;
  }
}

function renderPortalSearch() {
  const card = document.getElementById('verifyCard');
  card.innerHTML = `
    <div class="verify-head">
      <div class="status-badge search">
        <div class="status-icon">🔍</div>
        <span>Credential Registry</span>
      </div>
      <h1 class="verify-title">Verify Certificate</h1>
      <p class="verify-sub">Search by Certificate ID or upload a verification registry file.</p>
    </div>
    <div class="verify-body">
      <div class="verify-search-box">
        <div class="field">
          <label>Certificate ID</label>
          <div style="display:flex;gap:8px">
            <input id="searchIdInput" placeholder="e.g. ICML-2026-0001" style="flex:1">
            <button class="btn primary" id="searchIdBtn">Verify</button>
          </div>
        </div>
      </div>

      <div id="registryStatus" class="mini-help" style="margin-bottom:16px;font-size:12px;color:var(--muted)"></div>

      <div class="card panel" style="background:#fafbfc;border:1px dashed #cfd3da;text-align:center;padding:24px 16px">
        <strong style="font-size:13px;display:block">Upload Registry JSON</strong>
        <p style="font-size:11px;color:var(--muted);margin:4px 0 12px">Load a <code>verification-registry.json</code> file to verify certificates offline.</p>
        <button class="btn" id="chooseRegistryBtn">Choose File</button>
        <input id="registryFileInput" type="file" accept=".json" hidden>
      </div>

      <div id="searchResult" style="margin-top:16px"></div>
    </div>
  `;

  const input = document.getElementById('searchIdInput');
  const btn = document.getElementById('searchIdBtn');
  const fileInput = document.getElementById('registryFileInput');
  const chooseBtn = document.getElementById('chooseRegistryBtn');

  const doSearch = () => {
    const q = input.value.trim().toUpperCase();
    if (!q) return;
    const resEl = document.getElementById('searchResult');
    if (!loadedRegistry || !Array.isArray(loadedRegistry.certificates)) {
      resEl.innerHTML = `<div class="notice">To look up by ID manually, upload your <code>verification-registry.json</code> file above, or scan the QR code printed on the certificate.</div>`;
      return;
    }
    const match = loadedRegistry.certificates.find(c => String(c.id).toUpperCase() === q);
    if (match) {
      verifyPayload({
        id: match.id,
        name: match.name,
        event: match.event || loadedRegistry.event,
        role: match.role,
        date: match.date,
        org: match.organization || loadedRegistry.organization,
        sig: match.sig,
        version: Number(match.sigVersion || 1)
      }, { registryMatched: true });
    } else {
      resEl.innerHTML = `<div class="notice" style="color:#b42318;border-color:#fecdd3;background:#fff5f5">No record found for Certificate ID "<strong>${esc(q)}</strong>" in the active registry.</div>`;
    }
  };

  btn.onclick = doSearch;
  input.onkeydown = e => { if (e.key === 'Enter') doSearch(); };

  chooseBtn.onclick = () => fileInput.click();
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      loadedRegistry = JSON.parse(text);
      const resEl = document.getElementById('searchResult');
      resEl.innerHTML = `<div class="notice" style="color:#0e7039;border-color:#b7ebc7;background:#e6f7ec">Loaded registry with <strong>${(loadedRegistry.certificates || []).length} certificates</strong>. You can now search by ID.</div>`;
      if (input.value.trim()) doSearch();
    } catch (err) {
      alert("Invalid JSON registry file: " + err.message);
    }
  };
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
