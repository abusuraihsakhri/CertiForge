<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">
  <meta name="description" content="CertiForge — Digital Certificate Verification Portal. Verify credential authenticity against the organizer's published registry.">
  <title>Verify Certificate — CertiForge</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/verify.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
<div class="verify-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">CF</div>
      <div><strong>CertiForge</strong><span>Verification Portal</span></div>
    </div>
    <div class="top-actions">
      <a href="index.html" class="btn ghost">Open Studio</a>
    </div>
  </header>

  <main class="verify-main">
    <div class="verify-card" id="verifyCard" role="status" aria-live="polite">
      <div class="verify-head">
        <div class="status-badge search">
          <div class="status-icon" aria-hidden="true">?</div>
          <span>Verification Portal</span>
        </div>
        <h1 class="verify-title">Verifying Certificate…</h1>
        <p class="verify-sub">Checking against the organizer's registry.</p>
      </div>
      <div class="verify-body">
        <div class="empty">Loading verification data…</div>
      </div>
    </div>
  </main>

  <footer class="verify-footer">
    <span>CertiForge — Registry-backed Credential Verification</span>
    <span id="timestamp"></span>
  </footer>
</div>

<noscript><div class="page noscript-note"><p>JavaScript is required to verify certificates on this page.</p></div></noscript>
<script type="module" src="js/verify.js"></script>
</body>
</html>
