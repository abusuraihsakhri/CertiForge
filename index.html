<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">
  <meta name="description" content="CertiForge is a privacy-first browser-based certificate studio for designing templates, importing participant spreadsheets, generating PDFs in bulk, and verifying certificate records.">
  <title>CertiForge — Certificate Studio</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>
<body>
<a class="skip-link" href="#app">Skip to main content</a>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">CF</div>
      <div><strong>CertiForge</strong><span>Certificate Studio</span></div>
    </div>
    <div class="top-actions">
      <button class="btn ghost" id="newProjectBtn">New</button>
      <button class="btn ghost" id="openProjectBtn">Open</button>
      <button class="btn ghost" id="saveProjectBtn">Save</button>
      <button class="btn primary" id="generateTopBtn">Generate</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar left-panel">
      <nav aria-label="Workflow steps">
        <div class="section-title">WORKFLOW</div>
        <button class="nav-item active" data-step="templates" aria-current="step"><span aria-hidden="true">01</span> Template</button>
        <button class="nav-item" data-step="editor"><span aria-hidden="true">02</span> Design</button>
        <button class="nav-item" data-step="data"><span aria-hidden="true">03</span> Participants</button>
        <button class="nav-item" data-step="mapping"><span aria-hidden="true">04</span> Mapping</button>
        <button class="nav-item" data-step="preview"><span aria-hidden="true">05</span> Preview</button>
        <button class="nav-item" data-step="generate"><span aria-hidden="true">06</span> Generate</button>
      </nav>

      <section class="sidebar-bottom">
        <div class="privacy-card">
          <div class="privacy-icon" aria-hidden="true">✓</div>
          <div><strong>Local-first</strong><p>Your participant data is processed in this browser.</p></div>
        </div>
        <button class="nav-item" id="helpBtn" aria-haspopup="dialog"><span aria-hidden="true">?</span> Help</button>
      </section>
    </aside>

    <section class="main-panel">
      <div id="app"></div>
    </section>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="projectFileInput" type="file" accept=".certiforge,.json" aria-label="Choose CertiForge project file" hidden>

<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
