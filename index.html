<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">
  <meta name="description" content="CertiForge is a privacy-first browser-based certificate studio. Design templates, import spreadsheets, generate bulk PDFs, and verify digital records.">
  <meta name="theme-color" content="#0f172a">
  <link rel="canonical" href="https://abusuraihsakhri.github.io/CertiForge/">
  <meta property="og:title" content="Certificate Studio | CertiForge">
  <meta property="og:description" content="CertiForge is a privacy-first browser-based certificate studio. Design templates, import spreadsheets, generate bulk PDFs, and verify digital records.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://abusuraihsakhri.github.io/CertiForge/">
  <meta property="og:image" content="https://abusuraihsakhri.github.io/CertiForge/assets/plates/cert-seal.png">
  <meta property="og:site_name" content="CertiForge">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Certificate Studio | CertiForge">
  <meta name="twitter:description" content="CertiForge is a privacy-first browser-based certificate studio. Design templates, import spreadsheets, generate bulk PDFs, and verify digital records.">
  <meta name="twitter:image" content="https://abusuraihsakhri.github.io/CertiForge/assets/plates/cert-seal.png">
  <title>Certificate Studio | CertiForge</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>
<body>
<a class="skip-link" href="#app">Skip to main content</a>
<div class="app-container">
  <!-- LEFT SIDEBAR -->
  <aside class="sidebar left-panel" id="appSidebar" aria-label="CertiForge workflow">
    <div class="sidebar-brand">
      <div class="brand-mark" aria-hidden="true">CF</div>
      <div class="sidebar-brand-copy">
        <strong>CertiForge</strong>
        <span>Certificate Studio</span>
      </div>
    </div>
    <nav aria-label="Workflow steps">
      <div class="section-title">WORKFLOW</div>
      <button class="nav-item active" data-step="templates" aria-current="step"><span aria-hidden="true">01</span> Template</button>
      <button class="nav-item" data-step="editor"><span aria-hidden="true">02</span> Design</button>
      <button class="nav-item" data-step="data"><span aria-hidden="true">03</span> Participants</button>
      <button class="nav-item" data-step="mapping"><span aria-hidden="true">04</span> Mapping</button>
      <button class="nav-item" data-step="preview"><span aria-hidden="true">05</span> Preview</button>
      <button class="nav-item" data-step="generate"><span aria-hidden="true">06</span> Generate</button>
    </nav>
    <section class="sidebar-bottom">
      <div class="privacy-card">
        <div class="privacy-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        </div>
        <div><strong>Secure & Local</strong><p>Participant data stays in your browser.</p></div>
      </div>
      <button class="nav-item" id="helpBtn" aria-haspopup="dialog"><span aria-hidden="true">?</span> Help</button>
    </section>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

  <!-- MAIN AREA -->
  <div class="main-content">
    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Open workflow menu" aria-controls="appSidebar" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="top-project" aria-live="polite">
          <span>Project</span>
          <strong id="topProjectName">Untitled Conference</strong>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn ghost" id="newProjectBtn">New</button>
        <button class="btn ghost" id="openProjectBtn">Open</button>
        <button class="btn ghost" id="saveProjectBtn">Save</button>
        <button class="icon-btn" id="themeToggleBtn" type="button" aria-label="Switch to light theme" aria-pressed="false" title="Switch theme">
          <svg class="theme-icon theme-icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
          <svg class="theme-icon theme-icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button class="btn primary" id="generateTopBtn">Generate</button>
      </div>
    </header>

    <!-- CONTENT -->
    <main id="app" class="workspace"></main>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="projectFileInput" type="file" accept=".certiforge,.json" aria-label="Choose CertiForge project file" hidden>

<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
